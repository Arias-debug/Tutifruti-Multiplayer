<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tutifruti Multiplayer</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="joinScreen" class="screen">
  <div class="card join-card">
    <div class="fruit-row">🍓 🍊 🍋 🥝 🍇</div>
    <h1>TUTIFRUTI</h1>
    <p class="subtitle">Multiplayer</p>
    <label>Tu nombre</label>
    <input id="nameInput" maxlength="20" placeholder="Ej. Arias">
    <button id="joinBtn">INGRESAR</button>
    <div id="joinMsg"></div>
  </div>
</div>

<main id="game" class="hidden">
  <header class="topbar">
    <div>
      <h1>TUTIFRUTI</h1>
      <span id="roundLabel">Sala de espera</span>
    </div>
    <div class="letter-box">
      <small>LETRA</small>
      <strong id="letter">?</strong>
    </div>
    <div class="timer-box">
      <small>TIEMPO</small>
      <strong id="timer">--</strong>
    </div>
  </header>

  <section class="layout">
    <aside class="sidebar">
      <div class="panel">
        <h3>JUGADORES</h3>
        <div id="players"></div>
      </div>

      <button id="startBtn" class="primary hidden">INICIAR PARTIDA</button>
      <button id="nextBtn" class="primary hidden">SIGUIENTE RONDA</button>

      <div class="panel chat-panel">
        <h3>CHAT</h3>
        <div id="messages"></div>
        <div class="chat-row">
          <input id="chatInput" placeholder="Mensaje...">
          <button id="sendChat">Enviar</button>
        </div>
      </div>
    </aside>

    <section class="content">
      <div id="lobbyCard" class="card lobby-card">
        <div class="fruit-row big">🍉 🍍 🍎 🍐 🍒</div>
        <h2>Esperando jugadores...</h2>
        <p>El anfitrión puede iniciar la partida cuando estén listos.</p>
      </div>

      <div id="playArea" class="hidden">
        <div class="categories" id="categories"></div>
        <button id="stopBtn" class="stop-btn">🛑 STOP</button>
      </div>

      <div id="resultsArea" class="hidden">
        <div class="results-head">
          <h2>Resultados de la ronda</h2>
          <p id="resultLetter"></p>
        </div>
        <div class="table-wrap">
          <table id="resultsTable"></table>
        </div>
      </div>
    </section>
  </section>
</main>

<div id="stopOverlay" class="hidden">
  <div class="stop-modal">
    <div>🛑</div>
    <h2>¡STOP!</h2>
    <p id="stopBy"></p>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="./js/game.js"></script>
</body>
</html>
